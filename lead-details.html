<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F5F5" />
<title>Lead details · Sleepwell</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone phone--beds">

    <!-- Pinned header; this frame has no gear -->
    <div class="sticky-top">
      <header class="setup-header">
        <img class="setup-header__bg" src="assets/img/header-bg.png" alt="" />
        <a class="setup-header__brand" href="index.html" aria-label="Back to Personal Corner">
          <img src="assets/img/sleepwell-logo.png" alt="Sleepwell" />
        </a>
      </header>
    </div>

    <main class="ld">

      <h1 class="ld__eyebrow">Lead details</h1>

      <div class="lead ld__lead">
        <span class="lead__head">
          <span class="lead__name">Ninarika Rawal</span>
          <span class="lead__date">21/09/2022 13:49 pm</span>
        </span>
        <span class="lead__phone">+919892839992</span>
      </div>

      <h2 class="ld__eyebrow ld__eyebrow--recs">Mattresses recommended</h2>

      <div class="ld__grid">

        <div class="mattress ld-mx">
          <span class="rec-card__head">
            <span class="mattress__name">Revital 4.0</span>
          </span>
          <span class="mattress__meta">
            <span class="ld-mx__lines">
              <span class="mattress__price">₹35,769</span>
              <span class="mattress__price">21 Sep 2022</span>
            </span>
            <span class="status status--sold">Sold</span>
          </span>
        </div>

        <div class="mattress ld-mx">
          <span class="rec-card__head">
            <span class="mattress__name">Spinetech Air Luxury</span>
          </span>
          <span class="mattress__meta">
            <span class="ld-mx__lines">
              <span class="mattress__price">₹35,769</span>
              <span class="mattress__price">21 Sep 2022</span>
            </span>
            <span class="status status--demo">Demo</span>
          </span>
        </div>

        <div class="mattress ld-mx">
          <span class="rec-card__head">
            <span class="mattress__name">Spinetech Air</span>
            <span class="rec-card__flag">
              <span class="rec-card__badge" title="Bestseller">
                <img src="assets/icons/bestseller-star.svg" alt="Bestseller" />
              </span>
            </span>
          </span>
          <span class="mattress__meta">
            <span class="ld-mx__lines">
              <span class="mattress__price">₹28,072</span>
              <span class="mattress__price">21 Sep 2022</span>
            </span>
            <span class="status status--demo">Demo</span>
          </span>
        </div>

        <div class="mattress ld-mx">
          <span class="rec-card__head">
            <span class="mattress__name">Admire</span>
          </span>
          <span class="mattress__meta">
            <span class="ld-mx__lines">
              <span class="mattress__price">₹14,729</span>
              <span class="mattress__price">21 Sep 2022</span>
            </span>
            <span class="status status--demo">Demo</span>
          </span>
        </div>

      </div>
    </main>

    <!-- Bottom bar -->
    <div class="bd-actions">
      <a class="bd-actions__back" href="leads.html" aria-label="Back to leads">
        <img src="assets/icons/nav-back-32.svg" alt="" />
      </a>
      <a class="bd-actions__confirm" href="welcome.html">Back to Home</a>
    </div>

  </div>
<script src="assets/js/breadcrumbs.js"></script>
</body>
</html>
