<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062B4E" />
<title>Personal Corner · Sleepwell</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">

    <!-- Header -->
    <header class="header">
      <div class="header__inner">

        <div class="greeting-row">
          <div class="greeting">
            <p class="greeting__hello">Welcome,</p>
            <p class="greeting__name">Gupta Furnishers</p>
            <p class="greeting__role">DEALER</p>
          </div>
          <div class="avatar">
            <img src="assets/img/avatar.png" alt="Gupta Furnishers" />
          </div>
        </div>

        <div class="titlebar">
          <div class="titlebar__left">
            <button class="icon-btn icon-btn--22" type="button" aria-label="Go back">
              <img src="assets/icons/back.svg" alt="" />
            </button>
            <div class="brand">
              <img src="assets/img/sleepwell-logo.png" alt="Sleepwell" />
            </div>
          </div>

          <h1 class="titlebar__title">Personal Corner</h1>

          <div class="titlebar__right">
            <button class="icon-btn icon-btn--24" type="button" aria-label="Cart">
              <img src="assets/icons/shopping-cart-01.svg" alt="" />
            </button>
            <button class="icon-btn icon-btn--24" type="button" aria-label="Search">
              <img src="assets/icons/search-md.svg" alt="" />
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- App grid -->
    <main class="grid">

      <a class="tile tile--yellow" href="#">
        <span class="tile__icon"><img class="ic ic--attendence" src="assets/img/attendence.png" alt="" /></span>
        <span class="tile__label">Attendence</span>
      </a>

      <a class="tile tile--orange" href="#">
        <span class="tile__icon"><span class="crop crop--calender"><img src="assets/img/calender.png" alt="" /></span></span>
        <span class="tile__label">Calender</span>
      </a>

      <a class="tile tile--red" href="#">
        <span class="tile__icon"><img class="ic ic--drive" src="assets/img/drive.png" alt="" /></span>
        <span class="tile__label">Drive</span>
      </a>

      <a class="tile tile--purple" href="#">
        <span class="tile__icon"><span class="crop crop--hangout"><img src="assets/img/hangout.png" alt="" /></span></span>
        <span class="tile__label">Hangout</span>
      </a>

      <a class="tile tile--blue" href="#">
        <span class="tile__icon"><img class="ic ic--jamboard" src="assets/img/jamboard.png" alt="" /></span>
        <span class="tile__label">Jamboard</span>
      </a>

      <a class="tile tile--yellow" href="digital-sales-tool.html">
        <span class="tile__icon"><img class="ic ic--dst" src="assets/img/digital-sales-tool.svg" alt="" /></span>
        <span class="tile__label">Digital Sales tool</span>
      </a>

      <a class="tile tile--orange" href="#">
        <span class="tile__icon"><img class="ic ic--maps" src="assets/img/maps.png" alt="" /></span>
        <span class="tile__label">Maps</span>
      </a>

      <a class="tile tile--red" href="#">
        <span class="tile__icon"><img class="ic ic--idea" src="assets/img/my-idea.png" alt="" /></span>
        <span class="tile__label">My Idea</span>
      </a>

      <a class="tile tile--purple" href="#">
        <span class="tile__icon"><img class="ic ic--covid" src="assets/img/self-declaration.png" alt="" /></span>
        <span class="tile__label">Self Decleration Covid-19</span>
      </a>

      <a class="tile tile--blue" href="#">
        <span class="tile__icon"><img class="ic ic--sheets" src="assets/img/sheets.png" alt="" /></span>
        <span class="tile__label">Sheets</span>
      </a>

      <a class="tile tile--yellow" href="#">
        <span class="tile__icon"><img class="ic ic--task" src="assets/img/task.png" alt="" /></span>
        <span class="tile__label">Task</span>
      </a>

    </main>

    <!-- Bottom bar -->
    <nav class="bottombar" aria-label="Primary">
      <div class="bottombar__nav">
        <button class="nav-btn" type="button" aria-label="Menu"><img src="assets/icons/menu-01.svg" alt="" /></button>
        <button class="nav-btn" type="button" aria-label="Notifications"><img src="assets/icons/bell-01.svg" alt="" /></button>
        <button class="nav-btn" type="button" aria-label="Home"><img src="assets/icons/home-02.svg" alt="" /></button>
        <button class="nav-btn" type="button" aria-label="Search"><img src="assets/icons/search-md-nav.svg" alt="" /></button>
        <button class="nav-btn nav-btn--lg" type="button" aria-label="Settings"><img src="assets/icons/settings.svg" alt="" /></button>
      </div>
    </nav>

  </div>
</body>
</html>
