<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F5F5" />
<title>Check out · Sleepwell</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone phone--checkout">

    <header class="setup-header">
      <img class="setup-header__bg" src="assets/img/header-bg.png" alt="" />
      <a class="setup-header__brand" href="index.html" aria-label="Back to Personal Corner">
        <img src="assets/img/sleepwell-logo.png" alt="Sleepwell" />
      </a>
    </header>

    <main class="mx">

      <section class="mx-sec">
        <h2 class="mx-sec__eyebrow">Did you sell any products?</h2>
        <div class="checkout-toggle" role="radiogroup" aria-label="Sold any products">
          <button class="checkout-toggle__btn" type="button" role="radio" aria-checked="false">Yes</button>
          <button class="checkout-toggle__btn is-selected" type="button" role="radio" aria-checked="true">No</button>
        </div>
      </section>

      <section class="mx-sec">
        <h2 class="mx-sec__eyebrow">Lead details</h2>
        <div class="checkout-fields">
          <input class="checkout-field" type="text" id="checkout-name" placeholder="Full Name*" aria-label="Full name" />
          <input class="checkout-field" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit Mobile number" aria-label="Mobile number" />
        </div>
      </section>

      <!-- No (Figma node 2284:13169): plain recommended list. -->
      <section class="mx-sec" id="checkout-sec-recommended">
        <h2 class="mx-sec__eyebrow">Mattresses Recommended</h2>
        <div class="checkout-list">
          <div class="checkout-list__row">
            <span class="checkout-list__name">Spinetech Air Luxury</span>
            <span class="checkout-list__price">₹49,302</span>
          </div>
          <div class="checkout-list__row">
            <span class="checkout-list__name">Spinetech Air</span>
            <span class="checkout-list__price">₹49,302</span>
          </div>
          <div class="checkout-list__row">
            <span class="checkout-list__name">Eminence</span>
            <span class="checkout-list__price">₹49,302</span>
          </div>
          <div class="checkout-list__row">
            <span class="checkout-list__name">Esteem</span>
            <span class="checkout-list__price">₹49,302</span>
          </div>
        </div>
      </section>

      <!-- Yes (Figma node 2288:13349): same list, but each mattress is
           checked off as sold. Same checkbox states as the Demo button on
           the mattress detail screens (Figma node 1386:10228). -->
      <section class="mx-sec" id="checkout-sec-sold" hidden>
        <h2 class="mx-sec__eyebrow">Select Mattresses Sold</h2>
        <div class="checkout-list">
          <button type="button" class="checkout-list__row checkout-list__row--checkable" aria-pressed="false">
            <img class="checkout-list__check" src="assets/icons/checkbox.svg" alt="" />
            <span class="checkout-list__name">Spinetech Air Luxury</span>
            <span class="checkout-list__price">₹49,302</span>
          </button>
          <button type="button" class="checkout-list__row checkout-list__row--checkable" aria-pressed="false">
            <img class="checkout-list__check" src="assets/icons/checkbox.svg" alt="" />
            <span class="checkout-list__name">Spinetech Air</span>
            <span class="checkout-list__price">₹49,302</span>
          </button>
          <button type="button" class="checkout-list__row checkout-list__row--checkable" aria-pressed="false">
            <img class="checkout-list__check" src="assets/icons/checkbox.svg" alt="" />
            <span class="checkout-list__name">Eminence</span>
            <span class="checkout-list__price">₹49,302</span>
          </button>
          <button type="button" class="checkout-list__row checkout-list__row--checkable" aria-pressed="false">
            <img class="checkout-list__check" src="assets/icons/checkbox.svg" alt="" />
            <span class="checkout-list__name">Esteem</span>
            <span class="checkout-list__price">₹49,302</span>
          </button>
        </div>
      </section>

    </main>

    <!-- Bottom bar (Figma node 2284:13169). Finish starts disabled — enabled
         only once Full Name has a value. -->
    <div class="bd-actions">
      <button class="bd-actions__back" type="button" aria-label="Go back">
        <img src="assets/icons/nav-back-32.svg" alt="" />
      </button>
      <button class="bd-actions__confirm" type="button" id="checkout-finish" disabled>Finish</button>
    </div>

  </div>

<script>
// No (Figma 2284:13169) shows the plain recommended list; Yes (2288:13349)
// swaps it for the same list with a per-mattress sold checkbox instead.
(function () {
  var group = document.querySelector('.checkout-toggle');
  var recommended = document.getElementById('checkout-sec-recommended');
  var sold = document.getElementById('checkout-sec-sold');

  group.addEventListener('click', function (e) {
    var picked = e.target.closest('.checkout-toggle__btn');
    if (!picked) return;
    [].forEach.call(group.querySelectorAll('.checkout-toggle__btn'), function (b) {
      var on = b === picked;
      b.classList.toggle('is-selected', on);
      b.setAttribute('aria-checked', String(on));
    });

    var isYes = picked.textContent.trim() === 'Yes';
    recommended.hidden = isYes;
    sold.hidden = !isYes;
  });
}());

// Each sold mattress checks off independently, same checked/unchecked icon
// swap as the Demo button (Figma node 1386:10228).
(function () {
  [].forEach.call(document.querySelectorAll('.checkout-list__row--checkable'), function (row) {
    var icon = row.querySelector('.checkout-list__check');
    row.addEventListener('click', function () {
      var checked = row.getAttribute('aria-pressed') !== 'true';
      row.setAttribute('aria-pressed', String(checked));
      icon.src = checked ? 'assets/icons/checkbox-checked.svg' : 'assets/icons/checkbox.svg';
    });
  });
}());

// Back: this screen is reached from both mattress.html and
// mattress-compare.html's Close sale button, so there is no single static
// parent to link to — history.back() returns to whichever it was.
(function () {
  document.querySelector('.bd-actions__back').addEventListener('click', function () {
    history.back();
  });
}());

// Finish is disabled until Full Name is filled (Figma renders it greyed
// out by default). Enabled, it ends the flow the same place every other
// ending in this app does — Welcome.
(function () {
  var name = document.getElementById('checkout-name');
  var finish = document.getElementById('checkout-finish');

  name.addEventListener('input', function () {
    finish.disabled = name.value.trim().length === 0;
  });

  finish.addEventListener('click', function () {
    location.href = 'welcome.html';
  });
}());
</script>
<script src="assets/js/breadcrumbs.js"></script>
</body>
</html>
