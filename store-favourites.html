<script>
// The design ships two card states and a live count, so the cards toggle.
// 42 is the catalogue size from the design; this frame only lists 16 of them,
// so swap it for the real total once this is wired to data.
(function () {
  var MAX = 4;                       // "Selected N out of 4" is a cap, not a catalogue size
  var grid = document.getElementById('grid');
  var out = document.getElementById('selected-count');
  var snackbar = document.getElementById('snackbar');
  var timer;

  function selectedCount() {
    return grid.querySelectorAll('[aria-pressed="true"]').length;
  }

  // Material single-line snackbar: 4s, and re-tapping restarts the clock
  // rather than queueing a second one.
  function toast() {
    snackbar.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      snackbar.classList.remove('is-visible');
    }, 4000);
  }

  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.mattress');
    if (!card) return;

    var selecting = card.getAttribute('aria-pressed') !== 'true';
    if (selecting && selectedCount() >= MAX) {
      toast();                       // deselecting is always allowed
      return;
    }

    card.setAttribute('aria-pressed', String(selecting));
    card.classList.toggle('is-selected', selecting);
    out.textContent = selectedCount();
  });

  snackbar.addEventListener('click', function () {
    clearTimeout(timer);
    snackbar.classList.remove('is-visible');
  });
}());

// Sort menu (Figma node 2272:13193). Opening, choosing and reordering are
// behaviour rather than layout — the design is the panel alone.
(function () {
  var trigger = document.getElementById('sort-trigger');
  var menu = document.getElementById('sort-menu');
  var label = document.getElementById('sort-label');
  var grid = document.getElementById('grid');
  var items = [].slice.call(menu.querySelectorAll('.bd-sortmenu__item'));

  var LABELS = {
    bestsellers: 'Bestsellers',
    low: 'Price: Low-Hi',
    high: 'Price: Hi-Low'
  };

  // "Bestsellers" has no field to sort on, so it restores the authored order.
  var cards = [].slice.call(grid.children);
  cards.forEach(function (c, i) { c.dataset.rank = i; });

  function priceOf(card) {
    return Number(card.querySelector('.mattress__price').textContent.replace(/[^0-9]/g, ''));
  }

  function open(state) {
    menu.hidden = !state;
    trigger.setAttribute('aria-expanded', String(state));
  }

  function sortBy(key) {
    var sorted = cards.slice().sort(function (a, b) {
      if (key === 'low') return priceOf(a) - priceOf(b);
      if (key === 'high') return priceOf(b) - priceOf(a);
      return a.dataset.rank - b.dataset.rank;
    });
    sorted.forEach(function (c) { grid.appendChild(c); });
  }

  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    open(menu.hidden);
  });

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      items.forEach(function (i) { i.setAttribute('aria-checked', String(i === item)); });
      label.textContent = LABELS[item.dataset.sort];
      sortBy(item.dataset.sort);
      open(false);
      trigger.focus();
    });
  });

  document.addEventListener('click', function (e) {
    if (!menu.hidden && !menu.contains(e.target)) open(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) { open(false); trigger.focus(); }
  });
}());
</script>
