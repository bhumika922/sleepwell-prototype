<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F5F5" />
<title>Store setup · Sleepwell</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone phone--setup">

    <!-- Pinned: only the content below scrolls -->
    <div class="sticky-top">
      <header class="setup-header">
        <img class="setup-header__bg" src="assets/img/header-bg.png" alt="" />
        <a class="setup-header__brand" href="index.html" aria-label="Back to Personal Corner">
          <img src="assets/img/sleepwell-logo.png" alt="Sleepwell" />
        </a>
      </header>
    </div>

    <main class="setup">
      <h1 class="setup__dealer">Tiwari &amp; Sons</h1>

      <h2 class="setup__eyebrow">Finish your store setup</h2>

      <div class="setup__grid">

        <a class="setup-card" href="bed-displays.html">
          <span class="setup-card__text">
            <span class="setup-card__title">Bed displays</span>
            <span class="setup-card__count">0 selected</span>
          </span>
          <span class="setup-card__cta">
            Setup now
            <img src="assets/icons/arrow-right.svg" alt="" />
          </span>
        </a>

        <a class="setup-card" href="#">
          <span class="setup-card__text">
            <span class="setup-card__title">Standing displays</span>
            <span class="setup-card__count">0 selected</span>
          </span>
          <span class="setup-card__cta">
            Setup now
            <img src="assets/icons/arrow-right.svg" alt="" />
          </span>
        </a>

        <a class="setup-card" href="#">
          <span class="setup-card__text">
            <span class="setup-card__title">Cut out samples</span>
            <span class="setup-card__count">0 selected</span>
          </span>
          <span class="setup-card__cta">
            Setup now
            <img src="assets/icons/arrow-right.svg" alt="" />
          </span>
        </a>

        <a class="setup-card" href="store-favourites.html">
          <span class="setup-card__text">
            <span class="setup-card__title">Store favourites</span>
            <span class="setup-card__count">0 selected</span>
          </span>
          <span class="setup-card__cta">
            Setup now
            <img src="assets/icons/arrow-right.svg" alt="" />
          </span>
        </a>

      </div>
    </main>

    <!-- Bottom bar: grey and inert, the state this frame shows. Progress runs
         through a setup card, not through Done. -->
    <div class="setup-actions">
      <button class="setup-actions__btn" type="button" disabled>Done</button>
    </div>

  </div>
</body>
</html>
